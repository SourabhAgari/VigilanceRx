apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: rx-vigilance
spec:
  provider:
    gcpsm:
      # No auth block on purpose. Without one the operator uses its own pod
      # identity, which is the Workload Identity binding created in
      # platform/secrets.tf. Any other setting would need a second binding.
      projectID: vigilancerx-502702