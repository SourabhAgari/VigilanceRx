# Fetches only the password. The username is not secret - it is already in
# Makefile and k8s/README.md - so it goes in as a literal rather than costing
# a second Secret Manager entry.

apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: kafka-credentials
  namespace: rx-vigilance

spec:
  # How often to re-read Secret Manager. Also how quickly a rotation lands.
  refreshInterval: 1h

  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore

  target:
    name: kafka-credentials
    creationPolicy: Owner

    template:
      type: Opaque
      data:
        sasl-username: "rx-vigilance-flink"
        sasl-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: rx-vigilance-redpanda-flink-password
---

# A pull secret is a Docker config file, so the template has to build that JSON.
# The "auth" field is base64 of "username:password" - Docker expects both the
# separate fields and the combined one.

apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: ghcr-pull
  namespace: rx-vigilance

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore

  target:
    name: ghcr-pull
    creationPolicy: Owner

    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"sourabhragari","password":"{{ .token }}","email":"agarisra@gmail.com","auth":"{{ printf "sourabhragari:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: rx-vigilance-ghcr-token