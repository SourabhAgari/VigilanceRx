              "unit": "short",
              "custom": {
                "fillOpacity": 12,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "gradientMode": "opacity",
                "showPoints": "never",
                "spanNulls": true,
                "axisBorderShow": false,
