apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: rx-vigilance
  namespace: rx-vigilance
spec:
  image: ghcr.io/sourabhagari/rx-vigilance:main
  imagePullPolicy: Always
  flinkVersion: v1_18
  serviceAccount: flink

  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "1"
    state.checkpoints.dir: gs://vigilancerx-502702-rx-vigilance-ckpt/rx-vigilance-ckpt
    state.savepoints.dir: gs://vigilancerx-502702-rx-vigilance-ckpt/rx-vigilance-savepoints
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"

    # #147: the cluster reads /opt/flink/conf/log4j-console.properties, NOT the
    # log4j2.properties inside the job jar. The operator writes this map into that
    # file. Must be a SIBLING of flinkConfiguration — nested inside it, the
    # operator silently sees spec.logConfiguration=null and uses Flink's default.
  logConfiguration:
    "log4j-console.properties": |
      rootLogger.level = INFO
      rootLogger.appenderRef.console.ref = ConsoleAppender
      rootLogger.appenderRef.rolling.ref = RollingFileAppender

      # Our code at INFO, frameworks at WARN. Flink and Kafka at INFO produce
      # enormous volume for little value, and Cloud Logging bills per GB.

      logger.rxvigilance.name = com.healthcare.rxvigilance
      logger.rxvigilance.level = INFO

      logger.flink.name = org.apache.flink
      logger.flink.level = WARN

      logger.kafka.name = org.apache.kafka
      logger.kafka.level = WARN

      logger.pekko.name = org.apache.pekko
      logger.pekko.level = WARN

      logger.hadoop.name = org.apache.hadoop
      logger.hadoop.level = WARN

      logger.zookeeper.name = org.apache.zookeeper
      logger.zookeeper.level = WARN

      # JSON to stdout: GKE ships container stdout to Cloud Logging, which can                                                                                                     
      # only filter on structured fields. Template baked into the image at                                                                                                         
      # /opt/flink/usrlib — NOT conf/, which the operator mounts a ConfigMap                                                                                                       
      # over. file:, not classpath:, because the cluster's log4j cannot read                                                                                                       
      # resources inside the job jar. 

      appender.console.name = ConsoleAppender
      appender.console.type = CONSOLE
      appender.console.layout.type = JsonTemplateLayout
      appender.console.layout.eventTemplateUri = file:///opt/flink/usrlib/log4j2-gcp-layout.json
      
      # Plain text on purpose: this file is what the Flink Web UI's Logs tab
      # reads, and JSON is unreadable there. Pod-local, so it costs nothing in
      # Cloud Logging.

      appender.rolling.name = RollingFileAppender
      appender.rolling.type = RollingFile
      appender.rolling.append = true
      appender.rolling.fileName = ${sys:log.file}
      appender.rolling.filePattern = ${sys:log.file}.%i
      
      appender.rolling.layout.type = PatternLayout
      appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
      
      appender.rolling.policies.type = Policies
      appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
      appender.rolling.policies.size.size = 100MB
      appender.rolling.policies.startup.type = OnStartupTriggeringPolicy
      
      appender.rolling.strategy.type = DefaultRolloverStrategy
      appender.rolling.strategy.max = 10
      
      logger.gcs.name = com.google.cloud.hadoop
      logger.gcs.level = WARN  
      
      logger.netty.name = org.apache.flink.shaded.akka.org.jboss.netty.channel.DefaultChannelPipeline
      logger.netty.level = OFF
  

  jobManager:
    resource:
      memory: "2048m"
      cpu: 1
    podTemplate: &podTemplate
      apiVersion: v1
      kind: Pod
      metadata:
        name: pod-template
      spec:
        imagePullSecrets:
          - name: ghcr-pull
        containers:
          - name: flink-main-container
            ports:
              - name: metrics
                containerPort: 9249
            env:
              # Routes java.util.logging (the GCS connector) through log4j so those
              # lines are JSON too. JUL reads this property when its LogManager first
              # initialises, too early for any config file — so it has to be a JVM flag.
              #
              # It must NOT go in flinkConfiguration.env.java.opts.all: that key REPLACES
              # Flink's value rather than appending to it, and Flink 1.18's default value
              # is the JDK-17 --add-exports/--add-opens list. Setting it to this property
              # alone removed --add-opens=java.base/java.util=ALL-UNNAMED, so Kryo could
              # no longer reflect into JDK collections and every operator-state restore
              # failed — a 13-hour crash loop that printed perfect JSON logs while never
              # running. JAVA_TOOL_OPTIONS is additive: the JVM applies it on top of the
              # command line, so Flink's defaults survive, including across upgrades.
              # The LogManager class is loadable because log4j-jul sits in /opt/flink/lib
              # (system classpath) — see the Dockerfile.
              - name: JAVA_TOOL_OPTIONS
                value: "-Djava.util.logging.manager=org.apache.logging.log4j.jul.LogManager"
              - name: ENABLE_BUILT_IN_PLUGINS
                value: flink-gs-fs-hadoop-1.18.1.jar
              - name: KAFKA_SASL_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: kafka-credentials
                    key: sasl-username
              - name: KAFKA_SASL_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: kafka-credentials
                    key: sasl-password

  taskManager:
    # 2048m carried over from the Phase 2 smoke job, which held no state.
    # AdherenceJob uses RocksDB, which takes memory outside the JVM heap
    # (~635m managed of this 2048m). Sized properly in #101 against real
    # node Allocatable figures — see CLAUDE.md §10.
    resource:
      memory: "4096m"
      cpu: 1
    podTemplate: *podTemplate

  job:
    jarURI: local:///opt/flink/usrlib/rx-vigilance.jar
    entryClass: com.healthcare.rxvigilance.AdherenceJob
    parallelism: 1
    upgradeMode: savepoint
    args:
      - "--profile"
      - "gke"