name: Deploy

# Runs on every push to main, and manually via workflow_dispatch.
# The paths-ignore below is what stops the deploy job's own commit from
# retriggering this workflow.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    # The deploy job commits back to main. Without this, that commit would
    # retrigger this workflow, which would commit again — a loop.
    paths-ignore:
      # The deploy job commits back to main. Without this, that commit would
      # retrigger this workflow, which would commit again - a loop.
      - 'k8s/**'

      # Documentation cannot change the image, and a rebuild here is not free:
      # it restarts a healthy job for about 64 seconds (#133's measurement) and
      # pushes another 600 MB image tagged with a commit that changed no code.
      # Happened four times on 2026-08-09/10 for ledger edits alone (#135).
      #
      # A push is skipped only when EVERY changed file matches this list, so a
      # commit touching both docs and code still deploys.
      - '**.md'



env:
  # Hardcoded, and lowercase, on purpose. GHCR rejects uppercase repository
  # names and github.repository_owner is "SourabhAgari". This string must match
  # images[].name in k8s/flink/kustomization.yaml exactly, or the yq select in
  # the deploy job matches nothing and the deploy silently does nothing at all.
  IMAGE: ghcr.io/sourabhagari/rx-vigilance

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # No JDK or Maven step: the Dockerfile's builder stage runs `mvn package`
      # itself, so building the jar here too would compile the project twice.
      # No --platform either: GitHub runners are amd64, same as the GKE nodes
      # (k8s/README.md records why that matters for local builds).
      - name: Build and push
        env:
          TAG: ${{ github.sha }}
        run: |
          # --build-arg GIT_SHA: bakes the commit into RXV_IMAGE_TAG so every log
          # line carries the deployment it came from (#147). Same value as the
          # image tag, so the two cannot drift.
          docker build --build-arg GIT_SHA="$TAG" -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          echo "pushed $IMAGE:$TAG"

  deploy:
      needs: build-and-push
      runs-on: ubuntu-latest
      permissions:
        contents: write

      steps:
        - name: Create GitHub App token
          id: app-token
          uses: actions/create-github-app-token@v2
          with:
            app-id: ${{ secrets.APP_ID }}
            private-key: ${{ secrets.APP_PRIVATE_KEY }}

        - name: Checkout
          uses: actions/checkout@v4
          with:
            token: ${{ steps.app-token.outputs.token }}
            fetch-depth: 0

        - name: Point kustomization at the new image
          env:
            TAG: ${{ github.sha }}
          run: |
            yq -i '(.images[] | select(.name == strenv(IMAGE)) | .newTag) = strenv(TAG)' \
              k8s/flink/kustomization.yaml

        - name: Commit and push to main
          env:
            TAG: ${{ github.sha }}
          run: |
            git config user.name "rx-vigilance-bot[bot]"
            git config user.email "rx-vigilance-bot[bot]@users.noreply.github.com"

            git add k8s/flink/kustomization.yaml

            if git diff --staged --quiet; then
              echo "tag unchanged, nothing to deploy"
            exit 0
            fi

            git commit -m "deploy: rx-vigilance:$TAG"

            git push origin HEAD:main
