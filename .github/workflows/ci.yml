name: CI

on:
  pull_request:
  push:
    branches: [main]
    # deploy.yml commits the image tag here. Without this, a one-line YAML
    # change would run the full build, test and Sonar cycle for no signal.
    paths-ignore:
      - 'k8s/**'

# The repo default is read-only. deploy.yml showed a workflow can still grant
# itself more (it pushes to GHCR with packages: write), so this line is not
# redundant: it keeps CI at least privilege even if that default changes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven          # keys ~/.m2/repository on hash of pom.xml

      - name: Build and test
        run: mvn -B clean verify

      - name: Set up JDK 21 (Sonar scanner runtime only)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Sonar Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B sonar:sonar

      - name: Docker build (no push)
        if: github.event_name == 'pull_request'
        run: docker build -t rx-vigilance:ci .