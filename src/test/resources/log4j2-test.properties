rootLogger.level = INFO

rootLogger.appenderRef.console.ref = console
rootLogger.appenderRef.file.ref = file

appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss,SSS} %-5p %c{1} - %m%n

appender.file.type = File
appender.file.name = file
appender.file.fileName = /tmp/adherence-it.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{HH:mm:ss,SSS} %-5p %c{1} - %m%n

# The operators guard every DEBUG line with isDebugEnabled(), so at INFO those bodies
# never run: JaCoCo counts them uncovered and a fault inside one would never surface.
# DEBUG runs them. additivity=false with a file-only appender keeps the console readable
# while still executing the lines.
logger.rxvigilance.name = com.healthcare.rxvigilance
logger.rxvigilance.level = DEBUG
logger.rxvigilance.additivity = false
logger.rxvigilance.appenderRef.file.ref = file