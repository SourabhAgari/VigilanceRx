# NOTE: this file governs LOCAL RUNS only. Tests use
# src/test/resources/log4j2-test.properties (log4j2 prefers log4j2-test.* on
# the classpath), and the Flink cluster reads
# /opt/flink/conf/log4j-console.properties, written by the operator from
# spec.logConfiguration. Three configs, three audiences. #147.
rootLogger.level = INFO
rootLogger.appenderRef.console.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.layout.type = JsonTemplateLayout
appender.console.layout.eventTemplateUri = classpath:log4j2-gcp-layout.json

# Our code at INFO; the frameworks at WARN. Flink and Kafka at INFO produce
# enormous volume with little value, and Cloud Logging bills per GB ingested.

logger.rxvigilance.name = com.healthcare.rxvigilance
logger.rxvigilance.level = INFO

logger.flink.name = org.apache.flink
logger.flink.level = WARN

logger.kafka.name = org.apache.kafka
logger.kafka.level = WARN